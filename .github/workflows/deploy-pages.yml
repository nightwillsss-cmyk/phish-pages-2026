name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Если нужно собрать проект (npm run build и т.д.) — добавь здесь
      # - name: Install dependencies
      #   run: npm ci
      # - name: Build
      #   run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.gmaa0UCOAbtLQRfQ199_q2tY9FFE-Cvhr739wy5J }}          # ← обязательно!
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}        # ← обязательно!
          command: pages deploy ./public --project-name=fdsjaifvijsfv --commit-dirty
          # gitHubToken: ${{ secrets.GITHUB_TOKEN }}             # раскомментируй, если хочешь preview-деплои и статусы в PR
